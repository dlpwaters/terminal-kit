name: Platform acceptance
on: workflow_dispatch
permissions:
  contents: read
jobs:
  mac-cli-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Headless install in isolated HOME
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          export HOME="$(mktemp -d "$RUNNER_TEMP/terminal-kit-home.XXXXXX")"
          tk_extra=()
          if [[ $(uname -m) == x86_64 ]]; then tk_extra=(--with intel-build); fi
          ./install.sh --profile headless --unattended "${tk_extra[@]}"
          export PATH="$HOME/.local/share/terminal-kit/bin:$HOME/.local/bin:$PATH"
          ./install.sh --profile headless --unattended "${tk_extra[@]}"
          terminal-kit doctor
          pi --version
          hermes --version
          opencode --version
          nvim --headless '+lua assert(require("lazy.core.config").plugins.LazyVim)' +qa
          tk_backup=$(python3 -c 'import json,pathlib; print(json.loads((pathlib.Path.home()/".local/state/terminal-kit/installation.json").read_text())["backup"])')
          terminal-kit rollback "$tk_backup"
          terminal-kit uninstall
